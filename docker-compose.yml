services:
  wordtrainer:
    build: .
    container_name: wordtrainer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WORD_STORE: /data
      HOST: 0.0.0.0
      PORT: "8000"
    env_file:
      - .env
    volumes:
      - wordtrainer_data:/data

volumes:
  wordtrainer_data:
